
name: Compilar APK Android

on:
  workflow_dispatch:
  push:
    branches: [main, actualizacion-estudio]

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      APP_DEBUG_KEYSTORE: ${{ github.workspace }}/.signing/debug.keystore
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Instalar Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - uses: actions/cache@v4
        with:
          path: .signing/debug.keystore
          key: medicina-debug-signing-v2
      - name: Comprobar firma de actualizaciones
        env:
          SIGNING_BACKUP: ${{ secrets.MEDICINA_SIGNING_KEYSTORE_BASE64 }}
        run: |
          mkdir -p .signing
          if [ ! -f "$APP_DEBUG_KEYSTORE" ] && [ -n "$SIGNING_BACKUP" ]; then
            printf '%s' "$SIGNING_BACKUP" | base64 --decode > "$APP_DEBUG_KEYSTORE"
          fi
          if [ ! -f "$APP_DEBUG_KEYSTORE" ]; then
            echo "Falta la clave de firma. Restaura MEDICINA_SIGNING_KEYSTORE_BASE64 para compilar una actualización."
            exit 1
          fi
          fingerprint=$(keytool -exportcert -keystore "$APP_DEBUG_KEYSTORE" -storepass android -alias androiddebugkey | sha256sum | cut -d ' ' -f 1)
          test "$fingerprint" = "d6f4196df346ad76b899acf646eb6ec7c4f5deb842b8a17529575669b9a2d791" || { echo "La firma no coincide con la versión 0.2.0."; exit 1; }
      - name: Compilar y probar
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Preparar actualización
        run: |
          mkdir -p entrega
          cp app/build/outputs/apk/debug/app-debug.apk entrega/MedicinaUNA-actualizacion.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs entrega/MedicinaUNA-actualizacion.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MedicinaUNA-debug-apk
          path: entrega/*.apk
          if-no-files-found: error

      - name: Guardar resultados de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pruebas-estudio
          path: app/build/reports/tests/testDebugUnitTest/


name: Compilar APK Android

on:
  workflow_dispatch:
  push:
    branches: [main, actualizacion-estudio]

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      APP_DEBUG_KEYSTORE: ${{ github.workspace }}/.signing/debug.keystore
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Instalar Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - uses: actions/cache@v4
        with:
          path: .signing/debug.keystore
          key: medicina-debug-signing-v2
      - name: Preparar firma de pruebas
        run: |
          mkdir -p .signing
          if [ ! -f "$APP_DEBUG_KEYSTORE" ]; then
            keytool -genkeypair -keystore "$APP_DEBUG_KEYSTORE" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
      - name: Compilar y probar
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Preparar ambas instalaciones
        run: |
          mkdir -p entrega
          cp app/build/outputs/apk/debug/app-debug.apk entrega/MedicinaUNA-actualizacion.apk
          gradle --no-daemon -PparallelInstall=true :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk entrega/MedicinaUNA-Estudio.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs entrega/MedicinaUNA-Estudio.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MedicinaUNA-debug-apk
          path: entrega/*.apk
          if-no-files-found: error

      - name: Guardar resultados de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pruebas-estudio
          path: app/build/reports/tests/testDebugUnitTest/
